<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abu Hansh</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; background: #0a0a0a; color: #fff; font-family: Helvetica, Arial, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
  h1 { font-size: clamp(48px, 15vw, 110px); margin: 0 0 28px; font-weight: 700; text-shadow: 0 0 12px rgba(255,255,255,.55), 0 0 30px rgba(255,255,255,.25); }
  p.desc { max-width: 560px; margin: 0 0 40px; color: #aaa; font-size: clamp(18px, 5vw, 28px); line-height: 1.4; }
  .btn { display: block; width: min(300px, 80vw); margin: 0 auto 22px; padding: 22px 0; background: #000; color: #fff; border: 0; border-radius: 22px; font-size: 24px; cursor: pointer; box-shadow: 0 0 14px rgba(255,255,255,.28); }
  .btn:active { box-shadow: 0 0 22px rgba(255,255,255,.6); }
  .page { display: none; }
  .page.on { display: flex; flex-direction: column; align-items: center; }
  h2 { font-size: 40px; margin: 0 0 16px; text-shadow: 0 0 10px rgba(255,255,255,.5); }
  .empty { color: #888; margin-bottom: 36px; font-size: 20px; }
  .card { width: min(560px, 94vw); margin: 0 auto 28px; padding: 28px 16px; background: #11101c; border: 1px solid #2a1f45; border-radius: 28px; }
  .card h2 { font-size: clamp(26px, 8vw, 40px); }
  .gen { background: #000; color: #fff; border: 0; border-radius: 18px; padding: 18px 34px; font-size: 20px; cursor: pointer; margin: 8px 0 28px; }
  .gen:active { box-shadow: 0 0 16px rgba(255,255,255,.5); }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 18px; padding: 10px 6px; border-bottom: 1px solid #2c2c36; }
  td { padding: 12px 6px; font-size: 15px; border-bottom: 1px solid #1d1d28; }
  td.k { font-family: monospace; word-break: break-all; }
  .cp { background: #000; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .card { position: relative; }
  .back { position: absolute; top: 14px; left: 14px; background: none; border: 0; color: #fff; font-size: 38px; line-height: 1; padding: 6px 12px; cursor: pointer; text-shadow: 0 0 10px rgba(255,255,255,.6); }
  body.full main { justify-content: flex-start; padding: 0; }
  body.full .page.on { width: 100%; }
  body.full .card { width: 100%; min-height: 100vh; margin: 0; border: 0; border-radius: 0; padding-top: 80px; }
  body.full #scripts { padding: 32px 20px; }
  .gen:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <section id="home" class="page on">
    <h1>Abu Hansh</h1>
    <p class="desc">Website For Publishing Roblox Scripts Specifically For “PvP” Maps All Scripts Are Created By Abu Hansh</p>
    <button class="btn" onclick="show('keys')">Keys</button>
    <button class="btn" onclick="show('scripts')">Scripts</button>
  </section>

  <section id="keys" class="page">
    <div class="card">
      <button class="back" onclick="show('home')" aria-label="Back">←</button>
      <h2>🔐 Key Generator</h2>
      <button class="gen" id="genBtn" onclick="genKey()">Generate Key</button>
      <div class="tbl">
        <table>
          <thead><tr><th>#</th><th>Key</th><th>Expires In</th><th>Copy</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="scripts" class="page">
    <h2>Scripts</h2>
    <p class="empty">Coming soon…</p>
    <button class="btn" onclick="show('home')">Back</button>
  </section>
</main>
<script>
  function show(id) {
    document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('on'); });
    document.getElementById(id).classList.add('on');
    document.body.classList.toggle('full', id !== 'home');
    window.scrollTo(0, 0);
  }
  var keys = [];
  var LIFE = 48 * 60 * 60 * 1000;
  function part() {
    var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    var a = new Uint32Array(5); crypto.getRandomValues(a);
    for (var i = 0; i < 5; i++) s += c[a[i] % c.length];
    return s;
  }
  var WAIT = 30, waiting = false;
  function genKey() {
    if (waiting) return;
    waiting = true;
    var btn = document.getElementById('genBtn');
    var left = WAIT;
    btn.disabled = true;
    btn.textContent = 'Please wait ' + left + 's';
    var t = setInterval(function () {
      left--;
      if (left > 0) { btn.textContent = 'Please wait ' + left + 's'; return; }
      clearInterval(t);
      keys.unshift({ key: 'AH-' + part() + '-' + part(), end: Date.now() + LIFE });
      draw();
      btn.disabled = false;
      btn.textContent = 'Generate Key';
      waiting = false;
    }, 1000);
  }
  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return [h, m, x].map(function (n) { return String(n).padStart(2, '0'); }).join(':');
  }
  function draw() {
    var now = Date.now();
    keys = keys.filter(function (k) { return k.end > now; });
    document.getElementById('rows').innerHTML = keys.map(function (k, i) {
      return '<tr><td>' + (i + 1) + '</td><td class="k">' + k.key + '</td><td>' + fmt(k.end - now) + '</td><td><button class="cp" onclick="copyKey(' + i + ', this)">Copy</button></td></tr>';
    }).join('');
  }
  function copyKey(i, btn) {
    var t = keys[i].key;
    function ok() { btn.textContent = 'Done'; setTimeout(function () { btn.textContent = 'Copy'; }, 1200); }
    try { navigator.clipboard.writeText(t).then(ok); } catch (e) {}
  }
  setInterval(function () { if (keys.length) draw(); }, 1000);
</script>
</body>
</html>
